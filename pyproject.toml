[project]
name = "submitproject"
version = "0.1.0"
description = "A desktop task manager built with CustomTkinter and SQLite"
readme = "README.md"
authors = [
    { name = "Mahan" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "werkzeug>=3.1.8",
]

[project.scripts]
app = "todo_app.login:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "todo_app"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]